apiVersion: mlsysops.eu/v1
cluster_placement:
  cluster_id:
    - mls-test-manage
component_interactions:
  - component_name1: client-app
    component_name2: server-app
    type: egress
components:
  - containers:
      - command:
          - python
          - TcpServer.py
        env:
          - name: OTEL_RESOURCE_ATTRIBUTES
            value: >-
              service.name=server-app, service.version=0.0.0,
              service.experimentid=test
          - name: OTEL_SERVICE_NAME
            value: server-app
          - name: NODE_IP
          - name: TELEMETRY_ENDPOINT
            value: $(NODE_IP):43170
          - name: TCP_SERVER_IP
            value: 0.0.0.0
        image: registry.mlsysops.eu/agent/agents/test_app:0.0.1
        image_pull_policy: Always
        ports:
          - container_port: 10000
            protocol: TCP
    metadata:
      name: server-app
      uid: 1asd23123
    restart_policy: OnFailure
  - containers:
      - command:
          - python
          - TcpClient.py
        env:
          - name: OTEL_RESOURCE_ATTRIBUTES
            value: >-
              service.name=server-app, service.version=0.0.0,
              service.experimentid=test
          - name: OTEL_SERVICE_NAME
            value: server-app
          - name: NODE_IP
          - name: TELEMETRY_ENDPOINT
            value: $(NODE_IP):43170
          - name: TCP_SERVER_IP
            value: server-app
        image: registry.mlsysops.eu/agent/agents/test_app:0.0.1
        image_pull_policy: Always
        ports:
          - container_port: 10000
            protocol: TCP
    metadata:
      name: client-app
    restart_policy: OnFailure
kind: MLSysOpsApp
metadata:
  name: test-application
  namespace: mlsysops