version: '3.8'

services:
    db:
        # image: registry.hackathon.mlsysops.eu/hackathon/mlconnector-db:0.0.1
        build: ./db
        container_name: database
        env_file:
            - .env
        restart: always
        environment:
            POSTGRES_DB: ${POSTGRES_DB}
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        
        #ports:
            #- "5432:5432"
        tty: true
        networks:
            - api_network
        volumes:
            - ./db_data:/var/lib/postgresql/data

        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
            interval: 10s
            timeout: 5s
            retries: 5

    app:
        #image: registry.hackathon.mlsysops.eu/hackathon/mlconnector-api:0.0.1
        build: ./src
        container_name: api
        env_file:
            - .env
        restart: always
        ports:
            - "8090:8090"
        healthcheck:
                test: ["CMD-SHELL", "curl -f http://localhost:8090/docs || exit 1"]
                interval: 10s
                timeout: 5s
                retries: 5
        depends_on:
            db:
                condition: service_healthy
                restart: true
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock 
            - /usr/bin/docker:/usr/bin/docker  
            #- ./src:/code 

        networks:
            - api_network

volumes:
    db_data:
    #/src/migrations:

networks:
  api_network:
