---
# DaemonSet for Node Agent
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: mlsysops-node-agent-{{ FITA_NODE_NAME }}
  namespace: mlsysops-framework
spec:
  selector:
    matchLabels:
      app: node-agent-{{ FITA_NODE_NAME }}
  template:
    metadata:
      labels:
        app: node-agent-{{ FITA_NODE_NAME }}
    spec:
      # Use nodeSelector to target nodes with mlsysops/continuumLayer=node
      nodeSelector:
        mlsysops.eu/continuumLayer: "cluster"
      initContainers:
        - name: delay-startup
          image: busybox
          command: ["sh", "-c", "echo 'Waiting...' && sleep 35"]
      containers:
        - name: fita-agent
          image: harbor.nbfc.io/mlsysops/fita-agent:fhp0.1
          imagePullPolicy: Always
          env:
            - name: NODE_NAME
              value: {{ FITA_NODE_NAME }}
            - name: EJABBERD_DOMAIN
              value: {{ KARMADA_HOST_IP }}
            - name: REDIS_HOST 
              value: {{ KARMADA_HOST_IP }}
            - name: NODE_PASSWORD
              value: "mysecret"
            - name: DESCRIPTION_PATH
              value: "/etc/mlsysops/descriptions"
          resources:
            requests:
              memory: "128Mi"
              cpu: "250m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          volumeMounts:
            - name: description-volume
              mountPath: /etc/mlsysops/descriptions
            - name: fita-config-volume
              mountPath: /etc/mlsysops/config
            - name: policies-volume
              mountPath: /etc/mlsysops/policies
      volumes:
        - name: fita-config-volume
          configMap:
            name: fita-agents-config
        - name: description-volume
          configMap:
            name: fita-system-descriptions
        - name: policies-volume
          configMap:
            name: fita-agents-policies

---
# Empty ConfigMap for Cluster Policies
apiVersion: v1
kind: ConfigMap
metadata:
  name: fita-agents-policies
  namespace: mlsysops-framework
data: {}

---
# Empty ConfigMap for agent configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: fita-agents-config
  namespace: mlsysops-framework
data: {}
